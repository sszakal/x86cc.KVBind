name: Release

# Publishing is driven by version tags: push `v1.2.3` to pack and publish 1.2.3 to NuGet.
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Gate the publish on the full suite (Docker for the integration tests is available on ubuntu-latest).
      - name: Unit tests
        run: dotnet test x86cc.KVBind.UnitTests/x86cc.KVBind.UnitTests.csproj -c Release

      - name: Integration tests
        run: dotnet test x86cc.KVBind.IntegrationTests/x86cc.KVBind.IntegrationTests.csproj -c Release

      - name: Pack
        run: |
          dotnet pack x86cc.KVBind.Core/x86cc.KVBind.Core.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o ./artifacts
          dotnet pack x86cc.KVBind.SourceGenerator/x86cc.KVBind.SourceGenerator.csproj -c Release -p:Version=${{ steps.ver.outputs.version }} -o ./artifacts

      # Pushing the .nupkg also pushes the adjacent .snupkg symbols. --skip-duplicate makes re-runs safe.
      - name: Push to NuGet
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>KVBind Sample</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script>
    // Dark by default (before Angular starts, so there is no light flash); ThemeService keeps it in sync.
    try { if (localStorage.getItem('kvbind-theme') !== 'light') document.documentElement.classList.add('dark'); }
    catch { document.documentElement.classList.add('dark'); }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
